---
name: live tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'makefile'
      - 'scripts/testenv.sh'
      - 'acceptance/**'
      - 'integration/**'
      - 'lib/providerproxy/**'
      - '.github/workflows/pr-integration.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # one job per suite and backend, so a failure names which layer broke and
  # on which server: the client's view of the API, or the tools' behaviour
  # on top of it
  integration:
    name: integration (lib/${{ matrix.backend }} against a real server)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [emby, jellyfin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version

      # ffmpeg generates the fixture videos, jq parses the setup responses
      # and openssl mints the provider proxy's CA. ffmpeg is not on the
      # runner image, so install it rather than assume it is there.
      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      # make owns the container lifecycle, so CI runs exactly what a
      # developer runs rather than a second copy of the same steps. Provider
      # calls replay from the committed cassettes, so this needs no network
      # beyond the container image.
      - name: Run the SDK suite
        run: make testacc-integration-${{ matrix.backend }}

      - name: Tear down
        if: always()
        run: |
          EMBYFIN_TEST_BACKEND=${{ matrix.backend }} EMBYFIN_TEST_CONTAINER=embyfin-mcp-integration-${{ matrix.backend }} \
            EMBYFIN_TEST_DATA="$HOME/.cache/embyfin-mcp/testenv/integration-${{ matrix.backend }}" \
            scripts/testenv.sh down || true

  acceptance:
    name: acceptance (tools against a real ${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [emby, jellyfin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version

      - name: Install prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg jq openssl docker

      - name: Run the tool suite
        run: make testacc-acceptance-${{ matrix.backend }}

      - name: Tear down
        if: always()
        run: |
          EMBYFIN_TEST_BACKEND=${{ matrix.backend }} EMBYFIN_TEST_CONTAINER=embyfin-mcp-acceptance-${{ matrix.backend }} \
            EMBYFIN_TEST_DATA="$HOME/.cache/embyfin-mcp/testenv/acceptance-${{ matrix.backend }}" \
            scripts/testenv.sh down || true
