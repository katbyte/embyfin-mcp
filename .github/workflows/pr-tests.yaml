---
name: tests
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/**'
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'makefile'
      - 'vendor/**'
      - '.github/workflows/**'
      # internal/pandorest's tests re-import the specs and regenerate the SDKs,
      # failing when api-definitions/, lib/emby or lib/jf are stale
      - 'docs/*-openapi.json'
      - 'api-definitions/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      - run: make test
