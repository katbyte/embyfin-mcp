---
name: Build
on:
  push:
    branches: [ 'main' ]
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - '.github/**'
      - '**.go'
      - 'vendor/**'
      - '.github/workflows/**'
      - 'Dockerfile'
      - '.dockerignore'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ./.go-version
      - run: make build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg VERSION=ci --build-arg COMMIT="${GITHUB_SHA::7}" -t embyfin-mcp .
      - name: smoke test the image
        run: docker run --rm embyfin-mcp version
